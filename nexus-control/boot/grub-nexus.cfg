# NEXUS CONTROL GRUB menu template.
# IMPORTANT: replace the two chainloader UUIDs/partition references with the
# actual Windows EFI and Ubuntu EFI entries from the target PC.
# This file is a template; do not install it blindly.
set timeout=10
set default=0
menuentry "Windows 10" --id nexus_windows {
    search --no-floppy --file --set=root /EFI/Microsoft/Boot/bootmgfw.efi
    chainloader /EFI/Microsoft/Boot/bootmgfw.efi
}
menuentry "Ubuntu" --id nexus_ubuntu {
    search --no-floppy --file --set=root /EFI/ubuntu/grubx64.efi
    chainloader /EFI/ubuntu/grubx64.efi
}
