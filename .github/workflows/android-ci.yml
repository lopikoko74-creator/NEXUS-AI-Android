name: Android CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  assemble:
    runs-on: ubuntu-latest
    env:
      HAS_NEXUS_SIGNING: ${{ env.HAS_NEXUS_SIGNING == 'true' }}
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools

      - name: Install Android 36 SDK, NDK and CMake
        run: sdkmanager "platforms;android-36" "build-tools;36.0.0" "ndk;27.2.12479018" "cmake;3.22.1"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'

      - name: Run unit tests
        run: gradle --no-daemon :app:testDebugUnitTest

      - name: Assemble signed APK when signing secrets are configured
        if: ${{ env.HAS_NEXUS_SIGNING == 'true' }}
        env:
          NEXUS_KEYSTORE_BASE64: ${{ secrets.NEXUS_KEYSTORE_BASE64 }}
          NEXUS_STORE_PASSWORD: ${{ secrets.NEXUS_STORE_PASSWORD }}
          NEXUS_KEY_ALIAS: ${{ secrets.NEXUS_KEY_ALIAS }}
          NEXUS_KEY_PASSWORD: ${{ secrets.NEXUS_KEY_PASSWORD }}
        run: gradle --no-daemon :app:assembleRelease

      - name: Assemble unsigned-for-updates debug APK (CI validation only)
        if: ${{ env.HAS_NEXUS_SIGNING != 'true' }}
        run: gradle --no-daemon :app:assembleDebug

      - name: Upload signed release APK
        if: ${{ env.HAS_NEXUS_SIGNING == 'true' }}
        uses: actions/upload-artifact@v4
        with:
          name: nexus-ai-release-signed
          path: app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error

      - name: Upload CI-only debug APK
        if: ${{ env.HAS_NEXUS_SIGNING != 'true' }}
        uses: actions/upload-artifact@v4
        with:
          name: nexus-ai-debug-ci-only
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
